name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Les commits faits par le bot (GITHUB_TOKEN) ne déclenchent pas « push » :
  # on redéploie donc après chaque mise à jour du roster.
  workflow_run:
    workflows: ['Mise à jour du roster']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
